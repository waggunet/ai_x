<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope%3Awght%40400%3B500%3B700%3B800&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <title>Stitch Design - Projects</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body id="project-page-body" class="bg-slate-50" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <header class="sticky top-0 z-50 bg-slate-50/80 backdrop-blur-md">
            <div class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-slate-200 px-10 py-4">
                <div class="flex items-center gap-3 text-slate-800">
                    <div id="header-logo-container">
                        </div>
                    <h2 id="header-title" class="text-slate-800 text-xl font-bold leading-tight tracking-[-0.015em]">
                        </h2>
                </div>
                <nav id="header-nav-links" class="flex items-center gap-6">
                    </nav>
            </div>
        </header>
        <main class="px-10 sm:px-20 lg:px-40 py-12 flex flex-1 justify-center">
            <div class="layout-content-container flex flex-col max-w-4xl flex-1 gap-12">
                <section id="featured-projects">
                    <h2 id="featured-projects-title" class="text-slate-800 text-4xl font-bold leading-tight tracking-tight mb-8">
                        </h2>
                    <div id="projects-list-container" class="grid grid-cols-1 md:grid-cols-1 gap-8">
                        </div>
                </section>
                <section id="work-experience">
                    <h2 id="work-experience-title" class="text-slate-800 text-4xl font-bold leading-tight tracking-tight mb-8">
                        </h2>
                    <div id="work-experience-list" class="space-y-8">
                        </div>
                </section>
                <section id="success-stories">
                    <h2 id="success-stories-title" class="text-slate-800 text-4xl font-bold leading-tight tracking-tight mb-8">
                        </h2>
                    <div id="success-stories-list" class="grid grid-cols-1 md:grid-cols-1 gap-8">
                        </div>
                </section>
            </div>
        </main>
        <footer class="bg-slate-100 border-t border-slate-200 py-8 text-center">
            <p id="footer-text" class="text-slate-600 text-sm">
                </p>
            <div id="social-links-container" class="flex justify-center gap-4 mt-2">
                </div>
        </footer>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
