<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope%3Awght%40400%3B500%3B700%3B800&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <title>Stitch Design - Career</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body id="career-page-body" class="bg-slate-50" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-slate-200 px-10 py-4 shadow-sm">
            <div class="flex items-center gap-3 text-slate-900">
                <div id="header-logo-container" class="h-8 w-8 text-blue-600">
                    </div>
                <h2 id="header-title" class="text-xl font-bold tracking-tight">
                    </h2>
            </div>
            <nav id="header-nav-links" class="flex items-center gap-8">
                </nav>
        </header>
        <main class="flex-1 px-10 py-12 lg:px-20 xl:px-40">
            <div class="mx-auto max-w-5xl">
                <h1 id="page-title" class="text-4xl font-bold tracking-tight text-slate-900 mb-12">
                    </h1>
                <div id="career-timeline-container" class="relative pl-12 border-l-2 border-slate-200">
                    </div>
            </div>
        </main>
        <footer class="border-t border-slate-200 bg-slate-100 text-center py-6 px-10">
            <p id="footer-text" class="text-sm text-slate-600">
                </p>
        </footer>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
