<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope%3Awght%40400%3B500%3B700%3B800&family=Noto+Sans%3Awght%40400%3B500%3B700%3B900" onload="this.rel='stylesheet'" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <title>Stitch Design - Education</title>
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>
<body id="education-page-body" style='font-family: Manrope, "Noto Sans", sans-serif;'>
<div class="relative flex size-full min-h-screen flex-col bg-slate-50 group/design-root overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 px-10 py-5 shadow-sm">
            <div class="flex items-center gap-3 text-slate-900">
                <div id="header-logo-container" class="size-7 text-blue-600">
                    </div>
                <h2 id="header-title" class="text-xl font-bold tracking-tight">
                    </h2>
            </div>
            <nav id="header-nav-links" class="flex items-center gap-8">
                </nav>
        </header>
        <main class="px-10 md:px-20 lg:px-40 py-10 flex-1">
            <div class="layout-content-container flex flex-col max-w-4xl mx-auto">
                <div class="mb-8">
                    <h1 id="page-title" class="text-slate-900 text-4xl font-bold tracking-tight">
                        </h1>
                </div>
                <section id="academic-background-section" class="mb-12">
                    <h2 id="academic-title" class="text-slate-800 text-2xl font-semibold tracking-tight mb-6 pb-2 border-b border-slate-200">
                        </h2>
                    <div id="academic-list-container" class="space-y-6">
                        </div>
                </section>
                <section id="certifications-section" class="mb-12">
                    <h2 id="certifications-title" class="text-slate-800 text-2xl font-semibold tracking-tight mb-6 pb-2 border-b border-slate-200">
                        </h2>
                    <div id="certifications-list-container" class="space-y-6">
                        </div>
                </section>
                <section id="additional-training-section">
                    <h2 id="training-title" class="text-slate-800 text-2xl font-semibold tracking-tight mb-6 pb-2 border-b border-slate-200">
                        </h2>
                    <div id="training-list-container" class="space-y-6">
                        </div>
                </section>
            </div>
        </main>
        <footer class="py-8 px-10 text-center border-t border-slate-200">
            <p id="footer-text" class="text-sm text-slate-600">
                </p>
        </footer>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
