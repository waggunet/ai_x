<!DOCTYPE html>
<html lang="ko" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <title></title>
    <style>
        
    </style>
  <script>
    let cnt = 0;            // 누적 횟수
    let right = 0;        // 유효한 점수를 입력한 횟수 
    let wrong = 0;         // 유효하지 않은 점수를 입력한 횟수
    let sum = 0;       // 점수누적

    while (confirm("누적할래?")) {
      const input = prompt("누적할 점수?");
      cnt++;
  
      if (input === null || input.trim() === "") {
        wrong++;
        continue;
      }

      const n = Number(input);
      if (!isNaN(n) && n >= 0 && n <= 100) {
        sum += n;
        right++;
      } else {
        wrong++;
      }
    }
    //횟수들과 누적점수 출력
    document.write(`
      <ul>
        <li>입력횟수 : ${cnt}번</li>
        <li>누적점수 : ${sum}</li>
        <li>점수를 제대로 입력한 횟수 : ${right}</li>
        <li>점수를 잘못 입력한 횟수: ${wrong}</li>
      </ul>
    `);
  </script>


</head>
<body>
    
</body>
</html>
