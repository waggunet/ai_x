<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head> <!-- head : 설정정보 -->
    <meta charset="utf-8" />
    <title>첫예제</title>
    <style> /* 이 페이지의 디자인 영역(css/css3) */
        body {
            background-color:lightpink;
            font-size:30pt;
        }
    </style>
    <script> /* 동적인부분*/
        name = prompt("이름은?", "홍길동"); //취소 클릭시 'null' 리턴
        if (name != 'null' && name != '') { // 입력 후 확인버튼 클릭시 
            document.write(name + '님 개반갑!!!<br>');
        }

    </script>
</head>
<body>
    <!-- body부분에는 웹문서에 출력될 정보 -->
    <h1>hello world!!</h1>
    <h2>hello world!!</h2>
    <h3>hello world!!</h3><br />
    안녕하세용<br>
         <marquee>오늘부터 웹표준    &nbsp;&nbsp;&nbsp;&nbsp; &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;  수업을 시작합니다.</marquee><br />
    hello world!!!
</body>
</html>
