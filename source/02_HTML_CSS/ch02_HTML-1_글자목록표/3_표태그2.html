<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title></title>
    <style>
        table{background-color:red;}
            
tr:hover{background-color:lightgreen;}
        tr {
            background-color: yellow;
        }
        td {
            text-align:left; /* 글씨 가운데 정렬 */
        }
        caption {
            background-color: lightyellow;
        }
    </style>
</head>
<body>
    <table>
        <caption>table ex1</caption>
        <tr>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
        </tr>
        <tr>
            <td>100</td>
            <td>60</td>
            <td>80</td>
        </tr>
    </table>
    <table>
        <caption>table ex2</caption>
        <tr>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
        </tr>
        <tr>
            <td>100</td>
            <td>60</td>
            <td>80</td>
        </tr>
        <tr>
            <th colspan="2"><center>평균</center></th>
            <td>80</td>
        </tr>
    </table>
    <table>
        <caption>table ex3</caption>
        <tr>
            <th rowspan="3">중간고사성적</th>
            <th>국어</th>
            <th>영어</th>
            <th>수학</th>
        </tr>
        <tr>
            <td>100</td>
            <td>60</td>
            <td>80</td>
        </tr>
        <tr>
            <th colspan="2"><center><b>평균</b></center></th>
            <td>80</td>
        </tr>
    </table>
</body>
</html>
